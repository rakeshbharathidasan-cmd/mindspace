<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mindspace</title>
<meta name="theme-color" content="#07061a">
<meta name="color-scheme" content="dark only">
<meta name="darkreader-lock">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Emo';src:local('Noto Color Emoji'),local('NotoColorEmoji'),local('Apple Color Emoji'),local('Segoe UI Emoji'),local('Samsung Color Emoji');unicode-range:U+00A9,U+00AE,U+203C,U+2049,U+2122,U+2139,U+2194-21AA,U+231A-23FF,U+24C2,U+25AA-25FE,U+2600-27BF,U+2934-2935,U+2B05-2B55,U+3030,U+303D,U+3297,U+3299,U+FE0F,U+200D,U+1F000-1FAFF}
/* Mindspace: mood + energy + cause journal behind PIN/fingerprint. Today · Timeline · Impact.
   Dark violet ground, aurora orb, mood colours run coral (rough) to emerald (great). */
:root{
  color-scheme:dark only;
  --bg:#07061a; --s1:#110f2a; --s2:#191637; --s3:#221e47; --line:#24204a; --line2:#332d62;
  --text:#f2efff; --muted:#a49fc8; --faint:#6c6795;
  --vio:#9d7bff; --pink:#ff7ad9; --cyan:#3cc8ff; --gold:#ffd77a; --up:#2ee59d; --dn:#ff5d73;
  --disp:'Emo','Sora',system-ui,sans-serif; --body:'Emo','Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14.5px/1.45 var(--body);max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 100px);
  background:radial-gradient(600px 380px at 110% -5%,rgba(157,123,255,.16),transparent 65%),radial-gradient(500px 360px at -20% 30%,rgba(255,122,217,.08),transparent 65%),var(--bg);background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--text);background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;width:100%;color-scheme:dark;outline:none}
input:focus,textarea:focus{border-color:var(--vio);box-shadow:0 0 0 3px rgba(157,123,255,.18)}
textarea{min-height:76px;resize:vertical}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes pg{from{opacity:0;transform:translateY(10px)}}
@keyframes pgl{from{opacity:0;transform:translateX(-26px)}}
@keyframes pgr{from{opacity:0;transform:translateX(26px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes breathe{50%{transform:scale(1.06)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{from{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:50%;position:relative;background:conic-gradient(from 0deg,#9d7bff,#ff7ad9,#3cc8ff,#2ee59d,#9d7bff);animation:rot 8s linear infinite;box-shadow:0 0 22px -4px rgba(157,123,255,.9)}
.mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2a2160,#07061a 75%)}
.brand b{display:block;font-family:var(--disp);font-weight:800;font-size:21px;letter-spacing:.5px;background:linear-gradient(90deg,#d9ccff,#ff9ee6 55%,#8fe3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11.5px;color:var(--faint);margin-top:-2px}
.hb{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);color:var(--muted)}
.icon-btn:active{transform:scale(.94)}
#view{animation:pg .3s ease both}
#view.l{animation-name:pgl} #view.r{animation-name:pgr}

.card{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;animation:rise .4s both}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.ch h3{margin:0;font-family:var(--disp);font-size:14.5px;font-weight:700}
.ch span{font-size:11.5px;color:var(--faint)}
.sech{font-size:11px;color:var(--faint);font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin:16px 2px 8px;display:flex;justify-content:space-between;gap:8px}
.sech span:last-child{letter-spacing:0;text-transform:none;font-weight:600}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);font-weight:800;text-align:center;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,#9d7bff,#ff7ad9);border:0;color:#120a2c;box-shadow:0 10px 26px -12px rgba(255,122,217,.8)}
.btn.danger{color:var(--dn)}
.btn.sm{display:inline-block;width:auto;padding:8px 12px;font-size:12.5px;border-radius:11px}
.btn.armed{background:var(--dn);color:#fff;border-color:var(--dn)}
.acts{display:flex;gap:8px;margin-top:14px}.acts .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:99px;background:var(--s2);border:1px solid var(--line2);font-size:12.5px;font-weight:700;color:var(--muted);transition:all .15s}
.chip.on{color:var(--text);border-color:var(--c,var(--vio));background:color-mix(in srgb,var(--c,var(--vio)) 20%,var(--s2));box-shadow:0 4px 14px -8px var(--c,var(--vio))}
.chip.on:not(.nopop){animation:pop .25s}
.scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.scroll::-webkit-scrollbar{display:none}
.scroll .chip{flex:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px}
.seg button{padding:8px 4px;border-radius:10px;font-weight:800;color:var(--muted);font-size:13px;transition:all .2s}
.seg button.on{color:#120a2c;background:linear-gradient(135deg,#c2b0ff,#ff9ee6)}

/* hero orb */
.hero{display:flex;align-items:center;gap:16px;padding:18px 16px}
.orbw{position:relative;width:118px;height:118px;flex:none;animation:breathe 5s ease-in-out infinite}
.orb{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--o1),var(--o2),var(--o3),var(--o1));animation:rot 9s linear infinite;filter:blur(.5px);box-shadow:0 0 50px -6px var(--o1)}
.orb::after{content:"";position:absolute;inset:7px;border-radius:50%;background:radial-gradient(circle at 38% 32%,color-mix(in srgb,var(--o1) 35%,#1b1640),#07061a 72%)}
.orbt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:42px;line-height:1}
.orbt small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:4px;letter-spacing:.5px}
.hero .k{font-size:11px;color:var(--faint);font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.hero .v{font-family:var(--disp);font-size:24px;font-weight:800;margin:2px 0}
.hero .s{font-size:12.5px;color:var(--muted)}
.epips{display:inline-flex;gap:3px;vertical-align:middle}
.epips i{width:7px;height:12px;border-radius:3px;background:var(--s3)}
.epips i.on{background:linear-gradient(180deg,#ffd77a,#ff9d4d);box-shadow:0 0 6px rgba(255,197,77,.6)}

.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mb{padding:10px 0 7px;border-radius:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,var(--s2)),var(--s2));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line2));text-align:center;font-size:27px;line-height:1.1;transition:transform .15s,background .2s}
.mb small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px}
.mb:active{transform:scale(.92)}
.mb.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--s2));transform:translateY(-4px);box-shadow:0 10px 22px -10px var(--c)}
.eb{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.eb button{padding:9px 0;border-radius:12px;background:var(--s2);border:1px solid var(--line2);font-size:11px;font-weight:800;color:var(--muted);text-align:center;transition:all .15s}
.eb button b{display:block;font-size:15px;letter-spacing:-2px}
.eb button.on{color:#1a1205;background:linear-gradient(180deg,#ffe3a0,#ffb36b);border-color:transparent;box-shadow:0 8px 18px -10px #ffb36b}

.ci{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cic{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--s1);border:1px solid var(--line);text-align:left;animation:rise .4s both}
.cic .i{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--s3);flex:none}
.cic b{display:block;font-size:13px}
.cic small{font-size:11.5px;color:var(--faint)}
.cic.due{border-color:var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--s1)),var(--s1));box-shadow:0 8px 24px -14px var(--c)}
.cic.due .i{background:color-mix(in srgb,var(--c) 30%,var(--s2));animation:breathe 2s ease-in-out infinite}
.cic.done small{color:var(--up)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{font-size:10.5px;color:var(--faint);font-weight:700}
.week i{display:grid;place-items:center;margin:4px auto 0;width:34px;height:34px;border-radius:50%;font-style:normal;font-size:17px;background:var(--s2);border:1px solid var(--line);animation:pop .4s both}
.week i.has{background:color-mix(in srgb,var(--c) 22%,var(--s2));border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.week .td{color:var(--text)}

/* feelings */
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.fb{padding:8px 2px 6px;border-radius:14px;text-align:center;font-size:24px;line-height:1.1;background:color-mix(in srgb,var(--c) 10%,var(--s2));border:1px solid color-mix(in srgb,var(--c) 28%,transparent);transition:transform .15s,background .2s}
.fb small{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb.on{background:color-mix(in srgb,var(--c) 30%,var(--s2));border-color:var(--c);transform:translateY(-3px);box-shadow:0 10px 20px -10px var(--c)}
.fb.on small{color:var(--text)}
.fb:active{transform:scale(.92)}
.fgrp{font-size:10.5px;font-weight:800;letter-spacing:.8px;color:var(--faint);margin:10px 2px 6px}
.fcount{display:flex;flex-wrap:wrap;gap:6px}
.fcount button{display:inline-flex;align-items:center;gap:5px;padding:6px 10px 6px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 12%,var(--s2));border:1px solid color-mix(in srgb,var(--c) 32%,transparent);font-size:12.5px;font-weight:700;animation:pop .35s both}
.fcount button b{font-size:16px}
.fcount button i{font-style:normal;font-size:11px;color:var(--c);font-weight:800;background:rgba(0,0,0,.25);border-radius:99px;padding:1px 6px}
.fcount button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 28%,var(--s2));box-shadow:0 6px 16px -8px var(--c)}
.frow{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.frow:last-child{border:0}
.frow .e{font-size:24px;text-align:center}
.crow.f{grid-template-columns:54px 1fr 84px 40px}
.crow select{height:40px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);color:var(--text);font:inherit;font-size:12px;padding:0 6px;color-scheme:dark}
/* balance + dip stories */
.glass{background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),var(--s1);border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 20px 40px -24px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);animation:rise .45s both}
.bhd .k{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:var(--faint)}
.bhd .big{font-family:var(--disp);font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.15;margin-top:2px}
.bhd .s{font-size:12px;color:var(--muted)}
.band{animation:fadein .8s .3s both}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pill{border-radius:16px;padding:9px 10px;background:color-mix(in srgb,var(--c) 10%,transparent);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);animation:rise .4s both}
.pill .l{font-size:9.5px;font-weight:800;letter-spacing:.8px;color:var(--faint)}
.pill .v{font-family:var(--disp);font-size:19px;font-weight:800;color:var(--c);margin-top:2px;text-shadow:0 0 14px color-mix(in srgb,var(--c) 60%,transparent)}
.pill .s{font-size:10.5px;color:var(--muted)}
.story{position:relative;overflow:hidden;width:100%;text-align:left;display:block}
.story::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#ff5d73,#9d7bff 55%,#2ee59d)}
.story.open::before{background:linear-gradient(180deg,#ff5d73,#ff9d4d)}
.sth{display:flex;justify-content:space-between;align-items:center;gap:10px}
.num{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#120a2c;background:linear-gradient(135deg,#ff8a9a,#ff5d73);box-shadow:0 0 16px -2px rgba(255,93,115,.7);flex:none}
.sth b{font-size:14px;display:block}
.sth small{font-size:11px;color:var(--faint)}
.spark{width:84px;flex:none}
.flow{display:grid;grid-template-columns:1fr 14px 1fr 14px 1fr;align-items:stretch;margin-top:12px}
.node{border-radius:14px;padding:8px 6px 9px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);text-align:center;min-width:0}
.node .l{font-size:9px;font-weight:800;letter-spacing:.9px;margin-bottom:5px}
.node .e{font-size:19px;line-height:1.2;letter-spacing:1px}
.node .t{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3;overflow-wrap:anywhere}
.node.lo{border-color:rgba(255,93,115,.35);background:rgba(255,93,115,.08)}
.node.li{border-color:rgba(46,229,157,.35);background:rgba(46,229,157,.08)}
.arr{display:grid;place-items:center;color:var(--faint);font-size:13px}
.meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ins{font-size:12.5px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(157,123,255,.14),rgba(157,123,255,.03));border:1px solid rgba(157,123,255,.25);margin-bottom:12px;animation:rise .4s both}
.ins b{color:#d9ccff}
/* presets + repeat */
.pre{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;margin-top:12px}.pre::-webkit-scrollbar{display:none}
.pc{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:14px;background:color-mix(in srgb,var(--c) 12%,var(--s2));border:1px solid color-mix(in srgb,var(--c) 40%,transparent);text-align:left;transition:transform .12s;animation:rise .35s both}
.pc:active{transform:scale(.94)}
.pc .e{font-size:22px;line-height:1}
.pc b{display:block;font-size:12.5px;white-space:nowrap}
.pc small{display:block;font-size:11px;color:var(--muted);white-space:nowrap}
.pc.add{--c:#6c6795;border-style:dashed;color:var(--muted);font-weight:700;font-size:12.5px;padding:8px 14px}
.pc.rl{--c:#9d7bff}
.rp{font-size:11.5px;font-weight:800;color:var(--pink);padding:3px 8px;border-radius:99px;background:rgba(255,122,217,.1);border:1px solid rgba(255,122,217,.3)}
.prow{display:grid;grid-template-columns:1fr 40px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow button.x{height:36px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);color:var(--faint);font-size:18px}
/* entries */
.ent{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;width:100%;text-align:left;padding:11px 12px;border-radius:16px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px;animation:rise .35s both}
.ent .e{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 20%,transparent)}
.ent .d{font-size:11.5px;color:var(--faint);display:flex;justify-content:space-between;gap:8px;align-items:center}
.ent p{margin:3px 0 0;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.ent .cs{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,#a49fc8) 14%,transparent);border:1px solid color-mix(in srgb,var(--c,#a49fc8) 30%,transparent);white-space:nowrap}
.dayh{font-size:11.5px;color:var(--muted);font-weight:800;margin:14px 4px 6px;display:flex;justify-content:space-between}

/* charts */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.3s ease forwards}
.dots circle,.dots text{animation:fadein .5s both}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tod{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;padding:6px 0;font-size:12.5px}
.tod .n b{display:block;font-size:13px}
.tod .n small{color:var(--faint);font-size:10.5px}
.bar{height:9px;border-radius:99px;background:var(--s3);overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow .8s cubic-bezier(.2,.9,.3,1) both}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--s3)}
.stack i{display:block;height:100%;transform-origin:left;animation:grow .7s both}
.catr{display:grid;grid-template-columns:104px 1fr 54px;gap:8px;align-items:center;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.catr:last-child{border:0}
.catr .v{text-align:right;font-size:12px;color:var(--muted)}

/* impact */
.imp{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.imp:last-child{border:0}
.imp .i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--c) 18%,var(--s2))}
.imp b{font-size:14px}
.imp .m{font-size:11.5px;color:var(--faint)}
.imp .dv{font-family:var(--disp);font-weight:800;font-size:16px;text-align:right}
.imp .dv small{display:block;font-size:10px;font-weight:600;color:var(--faint);font-family:var(--body)}
.up{color:var(--up)} .dn{color:var(--dn)}
.lg{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lg:last-child{border:0}
.lk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.lk>div{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.lk .e{font-size:20px}
.lk b{display:block;font-size:12px;margin-top:2px}
.lk small{font-size:10.5px;color:var(--faint)}
.insight{font-size:13px;padding:9px 12px;border-radius:12px;background:var(--s2);border-left:3px solid var(--c,var(--vio));margin-top:8px}
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.empty .e{font-size:40px;display:block;margin-bottom:8px;animation:breathe 3s infinite}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:rgba(10,8,30,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr;align-items:end}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:11px;font-weight:700;transition:color .2s}
.tb.on{color:var(--text)} .tb.on .ic{color:var(--pink);filter:drop-shadow(0 0 6px rgba(255,122,217,.7))}
.fab{width:60px;height:60px;margin:-28px auto 0;border-radius:50%;display:grid;place-items:center;color:#120a2c;background:linear-gradient(140deg,#c2b0ff,#ff7ad9);box-shadow:0 0 0 5px var(--bg),0 10px 30px -6px rgba(255,122,217,.8)}
.fab .ic{width:28px;height:28px;stroke-width:2.6}
.fab:active{transform:scale(.92)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(3,2,12,.65);opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;background:linear-gradient(180deg,#1a1640,#0f0c28);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.3,1),visibility 0s .32s}
.open .scrim{opacity:1;pointer-events:auto} .open .sheet{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.3,1)}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-family:var(--disp);font-size:18px}
.sheet h4{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.8px;margin:18px 0 8px}
.lbl{font-size:12px;color:var(--muted);font-weight:700;margin:14px 2px 7px;display:flex;justify-content:space-between}
.lbl span{font-weight:600;color:var(--faint)}
.note{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.5}
.crow{display:grid;grid-template-columns:54px 1fr 40px;gap:6px;margin-bottom:6px;align-items:center}
.crow input{padding:9px 10px}
.crow .e{text-align:center;font-size:18px;padding:7px 4px}
.crow button{height:40px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);color:var(--faint);font-size:18px}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--s3);transition:.2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#8d88b5;transition:.2s}
.sw input:checked+span{background:linear-gradient(135deg,#9d7bff,#ff7ad9)}
.sw input:checked+span::after{transform:translateX(20px);background:#fff}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

/* lock */
#lock{position:fixed;inset:0;z-index:50;background:radial-gradient(500px 400px at 50% 30%,rgba(157,123,255,.2),transparent 70%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 24px);user-select:none}
.lorbw{position:relative;width:110px;height:110px;margin-bottom:18px;animation:breathe 4s ease-in-out infinite}
.lorb{width:110px;height:110px;border-radius:50%;background:conic-gradient(from 0deg,#9d7bff,#ff7ad9,#ffd77a,#3cc8ff,#2ee59d,#9d7bff);animation:rot 7s linear infinite;box-shadow:0 0 60px -8px rgba(157,123,255,.9)}
.lorb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2a2160,#07061a 70%)}
.lorbt{position:absolute;inset:0;display:grid;place-items:center;font-size:40px}
#lock h2{margin:0;font-family:var(--disp);font-weight:700;font-size:18px;text-align:center}
#lock p{color:var(--muted);text-align:center;margin:6px 0 16px;font-size:13.5px;max-width:300px}
.pins{display:flex;gap:12px;margin-bottom:18px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);transition:.15s}
.pins i.on{background:var(--pink);border-color:var(--pink);box-shadow:0 0 10px var(--pink)}
.pins.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:62px;border-radius:50%;background:var(--s1);border:1px solid var(--line2);font-family:var(--disp);font-weight:700;font-size:22px;transition:transform .1s,background .15s}
.pad button:active{transform:scale(.9);background:var(--s3)}
.pad .fp{color:var(--cyan)} .pad .fp .ic{width:28px;height:28px}
.lockerr{color:var(--dn);font-size:13px;min-height:20px;margin:-6px 0 8px;text-align:center}
.lnk{color:var(--muted);text-decoration:underline;font-size:13px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 94px);transform:translate(-50%,16px);width:min(92vw,440px);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#231d52;border:1px solid var(--line2);padding:11px 14px;border-radius:16px;font-size:13.5px;opacity:0;transition:.22s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--pink);font-weight:800;white-space:nowrap}
.demo{font-size:12px;color:var(--gold);background:rgba(255,215,122,.07);border:1px solid rgba(255,215,122,.22);border-radius:12px;padding:8px 12px;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="lock" hidden></div>
<div id="app" hidden>
<header>
  <div class="brand"><div class="mark"></div><div><b>Mindspace</b><small id="sub">what moves your mind</small></div></div>
  <div class="hb">
    <button class="icon-btn" data-act="lock" aria-label="Lock"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    <button class="icon-btn" data-act="settings" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>
<main id="view"></main>
<nav><div class="in">
  <button class="tb" data-act="tab" data-t="today"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today</button>
  <button class="tb" data-act="tab" data-t="time"><svg class="ic" viewBox="0 0 24 24"><path d="M3 17l5-6 4 4 5-7 4 5"/><path d="M3 21h18"/></svg>Timeline</button>
  <button class="fab" data-act="log" aria-label="Log a moment"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="tb" data-act="tab" data-t="impact"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.6 2.3 4.7.8.8 1.2 1.7 1.2 2.8V18h5v-1.5c0-1.1.4-2 1.2-2.8C16.8 12.6 18 11.2 18 9a6 6 0 0 0-6-6z"/><path d="M10 21h4"/></svg>Impact</button>
</div></nav>
</div>
<div id="sheetWrap"><div class="scrim" data-act="close"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
/* ===================== config ===================== */
const KEY = 'mindspace.v1', LKEY = 'mindspace.lock', ROLL = 4;   // a "day" runs 04:00 → 04:00, so a late-night entry counts to that day
const MOODS = [null, {e:'😣',l:'Rough',c:'#ff5d73'}, {e:'😕',l:'Low',c:'#ff9d4d'}, {e:'😐',l:'Okay',c:'#b3acd6'}, {e:'🙂',l:'Good',c:'#3cc8ff'}, {e:'😄',l:'Great',c:'#2ee59d'}];
const ENERGY = [null, 'Drained', 'Low', 'Steady', 'Charged', 'Peak'];
const PAL = ['#3cc8ff','#9d7bff','#ff7ad9','#ffd77a','#2ee59d','#ff9d4d','#22d3ee','#f472b6','#a3e635','#60a5fa','#facc15','#fb7185'];
const DEF_CAUSES = [['work','Work','💼'],['sleep','Sleep','😴'],['family','Family','🏡'],['baby','Baby','👶'],['gym','Gym','🏋️'],['market','Market','📈'],['health','Health','🩺'],['money','Money','💰'],['people','People','🗣️']]
  .map(([id,l,e],i) => ({id, l, e, c:PAL[i % PAL.length]}));
// v = how it usually sits on the mood scale (1 rough … 5 great); used to suggest the mood and to group the picker
const DEF_FEEL = [
  ['happy','Happy','😊',5,'#ffd23f'],['excited','Excited','🤩',5,'#ffb627'],['grateful','Grateful','🙏',5,'#2ee59d'],['loved','Loved','🥰',5,'#ff7ad9'],['proud','Proud','😎',5,'#3cc8ff'],['joyful','Joyful','😂',5,'#ffc54d'],
  ['satisfied','Satisfied','😌',4,'#34d399'],['calm','Calm','🧘',4,'#22d3ee'],['focused','Focused','🎯',4,'#60a5fa'],['motivated','Motivated','💪',4,'#a3e635'],['hopeful','Hopeful','🌤️',4,'#facc15'],['confident','Confident','🦁',4,'#ff9d4d'],['horny','Horny','😏',4,'#f43f5e'],['playful','Playful','😜',4,'#c084fc'],['relieved','Relieved','😮‍💨',4,'#5eead4'],
  ['nostalgic','Nostalgic','🥹',3,'#d8b4fe'],['bored','Bored','🥱',3,'#94a3b8'],['tired','Tired','😪',3,'#818cf8'],['hungry','Hungry','🤤',3,'#fb923c'],['confused','Confused','😵‍💫',3,'#a78bfa'],['restless','Restless','😬',3,'#fbbf24'],
  ['sad','Sad','😢',2,'#60a5fa'],['anxious','Anxious','😰',2,'#38bdf8'],['stressed','Stressed','😫',2,'#fb7185'],['lonely','Lonely','🥺',2,'#a5b4fc'],['guilty','Guilty','😔',2,'#94a3b8'],['jealous','Jealous','😒',2,'#4ade80'],['irritated','Irritated','😤',2,'#f97316'],['disappointed','Disappointed','😞',2,'#818cf8'],
  ['angry','Angry','😠',1,'#ef4444'],['furious','Furious','🤬',1,'#dc2626'],['overwhelmed','Overwhelmed','🤯',1,'#f472b6'],['scared','Scared','😨',1,'#7dd3fc'],['hurt','Hurt','💔',1,'#e11d48'],['hopeless','Hopeless','😩',1,'#6b7280']
].map(([id,l,e,v,c]) => ({id, l, e, v, c}));
const FGROUP = [[5,'POSITIVE'],[4,'GOOD'],[3,'NEUTRAL'],[2,'LOW'],[1,'HEAVY']];
const TOD = [['Morning','4–12',4,12],['Afternoon','12–5',12,17],['Evening','5–9',17,21],['Night','9–4',21,28]];
const fresh = () => ({entries:[], causes:DEF_CAUSES.map(c => ({...c})), letgo:{}, presets:[], feelings:DEF_FEEL.map(f => ({...f})), settings:{sound:true}});
const TABS = ['today','time','impact'];

/* ===================== state ===================== */
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v ?? d; } catch(e) { return d; } };
let S = {...fresh(), ...load(KEY, {})};
S.settings = {sound:true, ...(S.settings || {})}; S.presets = S.presets || []; if (!Array.isArray(S.feelings)) S.feelings = DEF_FEEL.map(f => ({...f}));
let L = {pinHash:null, salt:null, cred:null, grace:1, ...load(LKEY, {})};
let warned = false;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { if (!warned) { warned = true; toast('Could not save on this device'); } } };
const saveL = () => { try { localStorage.setItem(LKEY, JSON.stringify(L)); } catch(e) {} };
const UI = {tab:'today', range:30, cf:null, ff:null, F:null};

/* ===================== helpers ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pk = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const dayOf = t => dk(new Date(t - ROLL*3600000));
const today = () => dayOf(Date.now());
const addD = (k, n) => { const d = pk(k); d.setDate(d.getDate() + n); return dk(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const short = k => { const d = pk(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const longDay = k => { const d = pk(k); return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`; };
const hm = t => { const d = new Date(t); let h = d.getHours(); const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; return `${h}:${pad(d.getMinutes())} ${ap}`; };
const avg = a => a.length ? a.reduce((s,x) => s + x, 0) / a.length : null;
const moodOf = v => MOODS[Math.min(5, Math.max(1, Math.round(v)))];
const cause = id => S.causes.find(c => c.id === id) || {id, l:'Removed', e:'·', c:'#6c6795', off:true};
const active = () => S.causes.filter(c => !c.off);
const feel = id => S.feelings.find(f => f.id === id) || {id, l:'Removed', e:'·', v:3, c:'#6c6795', off:true};
const feelsOn = () => S.feelings.filter(f => !f.off);
const feelTags = ids => (ids || []).map(id => { const f = feel(id); return `<span class="tag" style="--c:${f.c}">${f.e} ${esc(f.l)}</span>`; }).join('');
const hourOf = t => { const d = new Date(t); return d.getHours() + d.getMinutes()/60; };
const sorted = () => S.entries.slice().sort((a,b) => b.t - a.t);
const inRange = (n = UI.range) => { const from = addD(today(), -(n-1)); return S.entries.filter(e => dayOf(e.t) >= from); };
const pips = n => `<span class="epips">${[1,2,3,4,5].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
const sgn = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1);
const toLocalInput = t => { const d = new Date(t); return `${dk(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function slot(t){ const h = new Date(t).getHours(); return h >= 4 && h < 12 ? 'am' : (h >= 19 || h < 4) ? 'pm' : null; }

/* ===================== sound (synthesised, no files) ===================== */
let AC = null;
function snd(kind, v){
  if (!S.settings.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
    const now = AC.currentTime;
    const tone = (f, st, d, type = 'sine', g = .07) => { const o = AC.createOscillator(), gn = AC.createGain(); o.type = type; o.frequency.value = f;
      gn.gain.setValueAtTime(0, now + st); gn.gain.linearRampToValueAtTime(g, now + st + .012); gn.gain.exponentialRampToValueAtTime(.0001, now + st + d);
      o.connect(gn).connect(AC.destination); o.start(now + st); o.stop(now + st + d + .05); };
    if (kind === 'tap') tone(1046, 0, .05, 'triangle', .025);
    else if (kind === 'tab') { tone(784, 0, .07, 'triangle', .025); tone(1046, .04, .07, 'triangle', .02); }
    else if (kind === 'mood') { const f = [0, 220, 262, 330, 392, 523][v]; tone(f, 0, .35); tone(f * 1.5, .06, .35, 'sine', .035); }
    else if (kind === 'energy') tone(300 + v * 90, 0, .12, 'triangle', .04);
    else if (kind === 'save') [523, 659, 784, 1047].forEach((f, i) => tone(f, i * .07, .55, 'sine', .055));
    else if (kind === 'unlock') { tone(440, 0, .25); tone(660, .09, .3); tone(880, .18, .4, 'sine', .04); }
    else if (kind === 'err') tone(150, 0, .2, 'square', .025);
    else if (kind === 'del') { tone(392, 0, .12, 'triangle', .04); tone(262, .08, .2, 'triangle', .04); }
    else if (kind === 'sheet') tone(660, 0, .09, 'sine', .03);
  } catch(e) {}
}

/* ===================== lock (PIN + fingerprint) ===================== */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
async function hashPin(pin, salt){ return b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin))); }
async function bioAvailable(){ try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e) { return false; } }
async function bioRegister(){
  const c = await navigator.credentials.create({publicKey:{challenge:rand(32), rp:{name:'Mindspace'}, user:{id:rand(16), name:'mindspace-owner', displayName:'Mindspace'},
    pubKeyCredParams:[{type:'public-key', alg:-7},{type:'public-key', alg:-257}], authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'}, timeout:60000, attestation:'none'}});
  L.cred = b64(c.rawId); saveL();
}
const bioCheck = () => navigator.credentials.get({publicKey:{challenge:rand(32), allowCredentials:[{type:'public-key', id:unb64(L.cred), transports:['internal']}], userVerification:'required', timeout:60000}});
let LK = {mode:null, buf:'', first:'', fails:0, until:0, next:null}, unlocked = false, hiddenAt = 0;
function showLock(mode){ LK = {...LK, mode, buf:'', first:''}; closeSheet(); $('app').hidden = true; $('lock').hidden = false; renderLock(); if (mode === 'unlock' && L.cred) setTimeout(tryBio, 350); }
function renderLock(msg = ''){
  const m = LK.mode, title = m === 'setup1' ? 'Create your PIN' : m === 'setup2' ? 'Confirm your PIN' : m === 'change1' ? 'Enter a new PIN' : 'Unlock Mindspace';
  const sub = m === 'setup1' ? 'Choose a 6-digit PIN. Your thoughts stay private to you.' : m === 'setup2' ? 'Type the same 6 digits again.' : m === 'change1' ? 'Your new 6-digit PIN.' : L.cred ? 'Touch the fingerprint sensor, or enter your PIN.' : 'Enter your 6-digit PIN.';
  $('lock').innerHTML = `<div class="lorbw"><div class="lorb"></div><div class="lorbt">🧠</div></div><h2>${title}</h2><p>${sub}</p>
    <div class="pins" id="pins">${[0,1,2,3,4,5].map(i => `<i class="${i < LK.buf.length ? 'on' : ''}"></i>`).join('')}</div><div class="lockerr" id="lockerr">${msg}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-pin="${n}">${n}</button>`).join('')}
      ${m === 'unlock' && L.cred ? `<button class="fp" data-pin="bio" aria-label="Use fingerprint"><svg class="ic" viewBox="0 0 24 24"><path d="M12 11v3a8 8 0 0 1-2 5.3M8.5 8.5A4 4 0 0 1 16 11v1.5M5 12a7 7 0 0 1 12.6-4.2M19 12v1.5a12 12 0 0 1-1 4.8M12 21.5a11 11 0 0 0 1.8-3.5M8 14.5a14 14 0 0 1-.8 3"/></svg></button>` : '<span></span>'}
      <button data-pin="0">0</button><button data-pin="del" aria-label="Delete">⌫</button></div>
    ${LK.next === 'change1' && m !== 'unlock' ? '<button class="lnk" style="margin-top:16px" data-pin="cancel">Cancel and keep my current PIN</button>' : ''}

      <button class="btn sm" data-act="unletgo" data-v="${id}">Bring back</button></div>`; }).join('')}</section>`;

function linkCard(){
  const lk = linked(), dm = dayMap(S.entries), dmood = k => { const es = dm[k]; return es ? avg(es.map(e => e.mood)) : null; };
  const days = Object.keys(dm), blocks = [];
  const cell = (e, l, ms) => { const m = avg(ms); return `<div><div class="e">${m != null ? moodOf(m).e : '·'}</div><b>${l}</b><small>${ms.length >= 2 ? `${m.toFixed(1)} · ${ms.length} days` : 'needs 2+ days'}</small></div>`; };
  if (lk.sleep) { const b = [[],[],[]]; days.forEach(k => { const s = lk.sleep[k], m = dmood(k); if (s == null || m == null) return; b[s < 360 ? 0 : s < 420 ? 1 : 2].push(m); });
    if (b.some(a => a.length)) blocks.push(`<div class="sech" style="margin-top:8px"><span>😴 Sleep Log · mood by hours slept</span></div><div class="lk">${cell('', 'Under 6h', b[0])}${cell('', '6–7h', b[1])}${cell('', '7h+', b[2])}</div>`); }
  if (lk.gym) { const g = [], r = []; days.forEach(k => { const m = dmood(k); if (m == null) return; (lk.gym.has(k) ? g : r).push(m); });
    if (g.length) blocks.push(`<div class="sech"><span>🏋️ Iron Paradise · gym days vs rest days</span></div><div class="lk" style="grid-template-columns:1fr 1fr">${cell('', 'Gym days', g)}${cell('', 'Rest days', r)}</div>`); }
  if (lk.water) { const y = [], n = []; days.forEach(k => { const m = dmood(k), w = lk.water[k]; if (m == null || w == null) return; (w >= lk.waterGoal ? y : n).push(m); });
    if (y.length + n.length) blocks.push(`<div class="sech"><span>💧 Hydra · water goal met vs missed</span></div><div class="lk" style="grid-template-columns:1fr 1fr">${cell('', 'Goal met', y)}${cell('', 'Below goal', n)}</div>`); }
  return `<section class="card"><div class="ch"><h3>From your other apps</h3><span>average mood</span></div>${blocks.length ? blocks.join('') : '<div class="small muted">Once you log moods on days you also use Sleep Log, Iron Paradise or Hydra on this phone, the patterns show up here automatically.</div>'}</section>`;
}

function download(name, text, type){ const b = new Blob([text], {type}), a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); }

      const have = new Set(S.entries.map(x => x.id)); let n = 0; d.entries.forEach(x => { if (!have.has(x.id)) { S.entries.push(x); n++; } });
      (d.causes || []).forEach(c => { if (!S.causes.some(x => x.id === c.id)) S.causes.push(c); }); (d.feelings || []).forEach(f => { if (!S.feelings.some(x => x.id === f.id)) S.feelings.push(f); }); (d.presets || []).forEach(p => { if (!S.presets.some(x => x.id === p.id)) S.presets.push(p); }); Object.assign(S.letgo, d.letgo || {});

  csv: () => { const q = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    const rows = [['Date','Time','Mood','Mood score','Energy','Feelings','Causes','Check-in','Note']].concat(S.entries.slice().sort((a,b) => a.t - b.t).map(e => [dayOf(e.t), hm(e.t), MOODS[e.mood].l, e.mood, e.energy, (e.feel || []).map(id => feel(id).l).join('; '), (e.causes || []).map(id => cause(id).l).join('; '), e.kind || '', e.note]));
    download(`mindspace-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv'); },
  wipe: el => arm(el, () => { try { localStorage.removeItem(KEY); localStorage.removeItem(LKEY); } catch(e) {} S = fresh(); L = {pinHash:null, salt:null, cred:null, grace:1}; closeSheet(); unlocked = false; showLock('setup1'); }),
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && A[el.dataset.act]) A[el.dataset.act](el); });

/* ===================== demo (preview only) ===================== */
function seedDemo(){
  S = fresh(); S.settings.sound = false; let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const t0 = new Date(); t0.setHours(0,0,0,0); const sleep = {}, gym = new Set(), water = {};
  const notes = {work:['Long review meeting, too many follow-ups','Deadline pressure on the monthly report','Good discussion with the team'],market:['Portfolio down 2% today','Checked prices too often','Calm market, no action'],baby:['Baby laughed for the first time at me','Night feeds, broken sleep','Played with the baby after work'],gym:['Strong session, new PR','Quick workout, felt fresh'],family:['Dinner together','Small argument at home'],money:['Unplanned expense'],people:['Annoying call from a relative','Caught up with an old friend']};
  for (let d = 44; d >= 0; d--) {
    const day = new Date(t0); day.setDate(day.getDate() - d); const k = dk(day), slept = 330 + Math.round(rnd() * 160); sleep[k] = slept;
    const g = rnd() < .5; if (g) gym.add(k); water[k] = 3000 + Math.round(rnd() * 1800);
    const n = 1 + Math.floor(rnd() * 3);
    for (let j = 0; j < n; j++) {
      const hr = [7, 13, 18, 22][Math.floor(rnd() * 4)] + rnd() * 2, tt = day.getTime() + hr * 3600000; if (tt > Date.now()) continue;
      const pool = ['work','work','market','baby','family','gym','money','people','sleep','health'], cs = [pool[Math.floor(rnd() * pool.length)]];
      if (rnd() < .35) cs.push(pool[Math.floor(rnd() * pool.length)]);
      let m = 3.4 + (slept < 360 ? -.8 : slept > 420 ? .4 : 0) + (g ? .5 : 0);
      if (cs.includes('work')) m -= .9; if (cs.includes('market')) m -= .7; if (cs.includes('money')) m -= .8; if (cs.includes('people')) m -= .5;
      if (cs.includes('baby')) m += .9; if (cs.includes('gym')) m += .8; if (cs.includes('family')) m += .4;
      m = Math.max(1, Math.min(5, Math.round(m + (rnd() - .5) * 1.4)));
      const en = Math.max(1, Math.min(5, Math.round((hr < 12 ? 3.6 : hr > 21 ? 2.2 : 3) + (slept < 360 ? -.8 : 0) + (rnd() - .5))));
      const uc = [...new Set(cs)], nl = notes[uc[0]];
      const FB = {1:['angry','overwhelmed','stressed','furious'],2:['anxious','stressed','sad','irritated','tired'],3:['tired','bored','restless','calm'],4:['satisfied','focused','calm','motivated','horny','hopeful'],5:['happy','grateful','excited','proud','loved']}[m];
      const fl = [FB[Math.floor(rnd() * FB.length)]]; if (rnd() < .3) fl.push(FB[Math.floor(rnd() * FB.length)]);
      S.entries.push({id:uid() + j, t:tt, mood:m, energy:en, causes:uc, feel:[...new Set(fl)], note:nl && rnd() < .7 ? nl[Math.floor(rnd() * nl.length)] : '', kind:hr < 12 ? 'am' : hr >= 19 ? 'pm' : null});
    }
  }
  S.letgo.people = Date.now() - 12 * 86400000;
  S.presets = [{id:'p1', mood:2, energy:2, causes:['work'], feel:['stressed'], name:'Work stress'}, {id:'p2', mood:5, energy:4, causes:['gym'], feel:['proud'], name:'Post-gym high'}, {id:'p3', mood:4, energy:3, causes:['baby','family'], feel:['loved'], name:'Family time'}];
  DEMO_LINK = {sleep, gym, water, waterGoal:4000};
}

(async function start(){
  if (window.MS_DEMO) { seedDemo(); L.salt = 'demo'; L.pinHash = await hashPin('123456', 'demo'); showLock('unlock'); return; }
  showLock(L.pinHash ? 'unlock' : 'setup1');
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
